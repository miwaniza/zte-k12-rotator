name: CI/CD Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish/Update GitHub Release with build artifacts'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 0. Tests, lints, formatting -- gate the build on these
  # -------------------------------------------------------------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      # zte-egui needs GTK/X11 headers on Linux to build (eframe -> winit).
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # No `cargo fmt --check` gate: the tree predates rustfmt and reformatting it
      # would be a separate, repo-wide change.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # -------------------------------------------------------------
  # 1. Multi-Platform Build Matrix
  # -------------------------------------------------------------
  build:
    name: Build - ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zte-control.exe
            archive: zte-control-windows-x64.zip

          - name: macOS Universal (ARM64 + x86_64)
            os: macos-latest
            target: aarch64-apple-darwin
            binary: zte-control
            archive: zte-control-macos-universal.tar.gz

          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: zte-control
            archive: zte-control-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS x86_64 Target (for Universal Binary)
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # -p is explicit: the workspace root is a package, so a bare `cargo build`
      # would build only the CLI and silently skip the desktop app.
      - name: Build Windows Binaries (CLI + desktop app)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --release -p zte-control --target ${{ matrix.target }}
          cargo build --release -p zte-egui --target ${{ matrix.target }}

      - name: Build macOS Universal Binaries (CLI + desktop app)
        if: matrix.os == 'macos-latest'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p zte-control --target "$t"
            cargo build --release -p zte-egui --target "$t"
          done
          mkdir -p target/universal
          for bin in zte-control zte-egui; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "target/universal/$bin"
            lipo -info "target/universal/$bin"
          done

      # Linux ships the CLI only; the egui app would pull GTK/X11 build deps that
      # a headless CLI release does not need.
      - name: Build Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release -p zte-control --target ${{ matrix.target }}

      # Package Windows Distribution (Full Zip with all scripts)
      - name: Package Windows Complete Dist (Zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $DistDir = "dist/zte-k12-rotator-windows"
          New-Item -ItemType Directory -Path "$DistDir/web" -Force | Out-Null
          New-Item -ItemType Directory -Path "$DistDir/tools" -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/zte-control.exe" "$DistDir/zte-control.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/zte-egui.exe" "$DistDir/zte-egui.exe" -Force
          Copy-Item "web/index.html" "$DistDir/web/index.html" -Force
          Copy-Item "web/manifest.json" "$DistDir/web/manifest.json" -Force -ErrorAction SilentlyContinue
          Copy-Item "web/sw.js" "$DistDir/web/sw.js" -Force -ErrorAction SilentlyContinue
          Copy-Item "web/icon.svg" "$DistDir/web/icon.svg" -Force -ErrorAction SilentlyContinue
          Copy-Item "tools/*" "$DistDir/tools/" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "*.bat" "$DistDir/" -Force -ErrorAction SilentlyContinue
          Copy-Item "rotate-and-notify.ps1" "$DistDir/" -Force -ErrorAction SilentlyContinue
          Copy-Item "README_WINDOWS.txt" "$DistDir/" -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "$DistDir/*" -DestinationPath "dist/zte-k12-rotator-windows.zip" -Force
          Copy-Item "target/${{ matrix.target }}/release/zte-control.exe" "${{ matrix.binary }}"

      # Package macOS Archive
      - name: Package macOS Universal Archive
        if: matrix.os == 'macos-latest'
        run: |
          cp target/universal/zte-control ${{ matrix.binary }}
          tar -czf ${{ matrix.archive }} -C target/universal zte-control zte-egui

      # Package Linux Archive
      - name: Package Linux Archive
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/${{ matrix.target }}/release/zte-control ${{ matrix.binary }}
          tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release zte-control

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.archive }}
            dist/zte-k12-rotator-windows.zip
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # 2. Release Publisher (On Tag or Workflow Dispatch)
  # -------------------------------------------------------------
  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release != 'false')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.exe" -o -name "zte-control" -o -name "*.zip" -o -name "*.tar.gz" \) | while read file; do
            cp -v "$file" release_assets/
          done
          echo "=== Collected Release Assets ==="
          ls -lh release_assets/

      # A manual run publishes to a rolling `nightly` prerelease. It used to reuse
      # the fixed tag `v1.0.0`, so any dispatch overwrote the assets of a released
      # version with an untagged build.
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ZTE K12 Rotator {0}', github.ref_name) || format('ZTE K12 Rotator nightly ({0})', github.sha) }}
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
