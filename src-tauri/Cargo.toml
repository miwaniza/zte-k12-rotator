[package]
name = "zte-desktop"
version = "1.0.0"
edition = "2021"
description = "Native desktop UI for ZTE modem control (Tauri front-end over zte-control core)"
authors = ["Dmytro Yemelianov"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
zte-control = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
strip = true
